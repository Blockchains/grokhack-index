name: nightly index
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Refresh repo list from Blockchains/awesome-grokhack
        run: |
          curl -sSfL https://raw.githubusercontent.com/Blockchains/awesome-grokhack/main/grok-forge.json -o /tmp/forge.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/forge.json'))
          repos = [{k: r.get(k) for k in ("fork", "upstream", "category", "stars", "license", "pushed_at", "description")} for r in d["repos"]]
          assert len(repos) > 10, "repo list unexpectedly small"
          json.dump(repos, open("repos.json", "w"), indent=1)
          print(len(repos), "repos")
          PY
      - name: Sync forks with upstream (best effort, default branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN cannot write to other repos; syncing needs the optional FORK_SYNC_TOKEN secret.
          if [ -n "${{ secrets.FORK_SYNC_TOKEN }}" ]; then
            export GH_TOKEN="${{ secrets.FORK_SYNC_TOKEN }}"
            python3 -c "import json;[print(r['fork']) for r in json.load(open('repos.json'))]" | while read f; do
              gh api -X POST "repos/$f/merge-upstream" -f branch="$(gh api repos/$f -q .default_branch)" >/dev/null 2>&1 || echo "sync skipped: $f"
            done
          else
            echo "FORK_SYNC_TOKEN not set: indexing forks as they are (upstream sync skipped)"
          fi
      - name: Index (shallow clones, deleted after scan)
        run: |
          df -h /
          python3 indexer/grokindex.py --repos repos.json --out data --work /tmp/gi-work --jobs 6
          df -h /
      - name: Build search page data
        run: python3 indexer/site_data.py
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir --no-banner --redact --config .gitleaks.toml data
          rm -f gitleaks
      - name: Commit if changed
        run: |
          git config user.name "Blockchains"
          git config user.email "Blockchains@users.noreply.github.com"
          git add -A data repos.json docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "index: $(python3 -c "import json;s=json.load(open('data/stats.json'));print(s['generated_at'], s['repos_indexed_ok'], 'repos', s['parts'], 'parts')")"
          git push -q
